<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>壁纸归档 · 光影回顾</title>
    <link rel="icon" href="https://bingimg.lei5214.cc.cd/logo.avif">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            background-image: url('https://image.lei5214.cc.cd/img/2026/08/10.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.1);
            z-index: 0;
            pointer-events: none;
        }

        body > * {
            position: relative;
            z-index: 1;
        }
        
        .top-bar {
            max-width: 1400px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            gap: 20px;
            background: rgba(22, 22, 22, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
        }
        
        .filters {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }
        
        .filter-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-label {
            font-size: 16px;
            color: #ffffff;
            font-weight: 500;
            white-space: nowrap;
        }
        .filter-input {
            width: 160px;
            height: 30px;
            padding: 0 10px;
            border: 2px solid #4d96ff;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            background: #4a4a4a; 
            color: #ffffff;
            transition: border-color 0.3s;
        }
        .filter-input:hover { border-color: #6aafff; }
        .filter-input:focus { border-color: #7abfff; box-shadow: 0 0 0 3px rgba(77,150,255,0.2); }
        .filter-input::placeholder { color: #666; }
        
        .btn-filter-reset {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            background: #6c757d;
            color: #fff;
            white-space: nowrap;
        }
        .btn-filter-reset:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }
        
        .stats {
            color: #ffffff;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .stats span {
            color: #ffffff;
            font-weight: 600;
        }
        
        .btn-home {
            padding: 6px 16px;
            border: 1px solid #4d96ff;
            border-radius: 6px;
            background: transparent;
            color: #4d96ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .btn-home:hover {
            background: #4d96ff;
            color: #fff;
        }

        /* ===== 月份选择弹窗 ===== */
        .date-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            z-index: 999;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .date-mask.show { display: block; }

        .date-popup {
            position: absolute;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 360px;
            overflow: hidden;
            animation: popupFade 0.2s ease;
            border: 1px solid #e8e8e8;
        }
        @keyframes popupFade {
            from { opacity: 0; transform: translateY(-8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px 6px 16px;
            border-bottom: 1px solid #f0f0f0;
            background: #fafafa;
        }
        .popup-header-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .popup-year-nav {
            display: flex;
            align-items: center;
            gap: 16px;
            justify-content: center;
            background: transparent;
            padding: 0;
        }
        .popup-year-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            padding: 0 10px;
            transition: color 0.2s;
            line-height: 1;
        }
        .popup-year-btn:hover {
            color: #4d96ff;
        }
        .popup-year-text {
            font-size: 17px;
            color: #333;
            font-weight: 600;
            min-width: 70px;
            text-align: center;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .popup-year-text:hover {
            background: #f0f5ff;
        }

        .popup-year-page-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            padding: 0 10px;
            transition: color 0.2s;
            line-height: 1;
        }
        .popup-year-page-btn:hover {
            color: #4d96ff;
        }

        .month-grid,
        .year-grid-popup {
            padding: 4px 14px 14px 14px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: #ffffff;
        }

        .month-cell,
        .year-cell {
            text-align: center;
            padding: 9px 0;
            font-size: 14px;
            color: #555;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            background: transparent;
        }
        .month-cell:hover,
        .year-cell:hover {
            background: #f0f5ff;
            color: #4d96ff;
        }
        .month-cell.active,
        .year-cell.active {
            background: #4d96ff;
            color: #fff;
        }
        .year-cell.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            color: #999;
        }
        .year-cell.disabled:hover {
            background: transparent;
            color: #999;
        }

        .grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .card {
            background: rgba(22, 22, 22, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .card .img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1a1a1a;
            overflow: hidden;
        }
        .card .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .card .img-wrapper img.loaded {
            opacity: 1;
        }
        .card .img-wrapper .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 14px;
            background: #1a1a1a;
        }
        .card .img-wrapper .placeholder .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top-color: #4d96ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .card .info {
            padding: 10px 14px 14px;
        }

        .card .info .date {
            font-size: 0.8rem;
            color: #ffffff;
            font-weight: 500;
        }

        .card .info .title {
            font-size: 0.85rem;
            color: #ffffff;
            font-weight: 600;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .info .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .card .info .btn-group .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 14px;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }

        .card .info .btn-group .download-btn svg {
            flex-shrink: 0;
        }

        .card .info .btn-group .btn-4k {
            background: #4d96ff;
        }
        .card .info .btn-group .btn-4k:hover {
            background: #3a7bd5;
        }

        .card .info .btn-group .btn-1080p {
            background: #6c757d;
        }
        .card .info .btn-group .btn-1080p:hover {
            background: #5a6268;
        }

        .card .info .btn-group .btn-download {
            background: #6c757d;
        }
        .card .info .btn-group .btn-download:hover {
            background: #5a6268;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 60px 0;
            color: #666;
            font-size: 1rem;
            grid-column: 1 / -1;
        }

        .loading::after {
            content: "";
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 3px solid #2a2a2a;
            border-top-color: #4d96ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: #1a1a1a;
            border-radius: 28px;
            max-width: 1600px;
            width: 100%;
            max-height: 95vh;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
            padding: 0;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.open .modal-box {
            transform: scale(1);
        }

        .modal-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0b0b0b;
            overflow: hidden;
            position: relative;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65%;
            background: linear-gradient(to top, 
                rgba(0, 0, 0, 0.92) 0%, 
                rgba(0, 0, 0, 0.6) 40%,
                rgba(0, 0, 0, 0.2) 70%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        .modal-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 32px 28px;
            z-index: 2;
            max-height: 60%;
        }
        
        .modal-scroll-desc {
            max-height: 45vh;
            overflow-y: auto;
            scrollbar-width: none;
            margin-top: 6px;
        }
        .modal-scroll-desc::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }

        .modal-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .modal-subtitle {
            display: none !important;
        }

        .modal-desc {
            font-size: 0.95rem;
            line-height: 1.8;
            opacity: 0.92;
            white-space: normal;
            word-break: break-word;
            color: #f0f0f0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }

        .modal-desc p {
            text-indent: 2em;
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        .modal-desc p + p {
            margin-top: 0;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.6rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            line-height: 1;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        footer {
            max-width: 1400px;
            margin: 40px auto 0;
            text-align: center;
            padding: 20px 0 10px;
            border-top: 1px solid rgba(26, 26, 26, 0.8);
            color: #ffffff;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .btn-home {
                margin-right: auto;
                justify-content: flex-start;
            }
            .filters {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                flex-shrink: 0;
            }
            .filter-item {
                display: flex;
                flex-direction: row;
                align-items: center;
                width: 100%;
                gap: 10px;
                justify-content: flex-start;
            }
            .filter-label {
                font-size: 16px;
                white-space: nowrap;
                flex-shrink: 0;
            }
            .filter-input {
                flex: 1;
                width: auto;
                min-width: 0;
            }
            .btn-filter-reset {
                width: auto !important;
                flex-shrink: 0;
                margin-top: 0;
                padding: 6px 14px;
            }
            .stats {
                width: 100%;
                text-align: left;
                white-space: nowrap;
                margin-top: 4px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
            .modal-overlay {
                padding: 0 !important;
            }
            .modal-box {
                max-width: 100%;
                max-height: 100vh !important;
                height: 100vh !important;
                margin: 0 !important;
                border-radius: 0 !important;
                display: flex;
                flex-direction: column;
            }
            .modal-image {
                flex: 1;
                aspect-ratio: unset !important;
                width: 100%;
                height: 100%;
            }
            .modal-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                background: #000;
            }
            .modal-content {
                padding: 14px 20px 18px;
                max-height: 55%;
            }
            .modal-scroll-desc {
                max-height: 30vh;
            }
            .modal-title {
                font-size: 1.2rem;
            }
            .modal-desc {
                font-size: 0.85rem;
                line-height: 1.7;
            }
            .modal-image::after {
                height: 65%;
            }
            .modal-close {
                top: 12px;
                right: 12px;
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
                z-index: 12 !important;
            }
            .date-popup {
                width: 92%;
                left: 4% !important;
            }
            .month-grid {
                padding: 12px 14px 16px;
                gap: 4px;
            }
            .month-cell {
                padding: 8px 0;
                font-size: 13px;
            }
            .popup-header {
                padding: 10px 14px;
                gap: 12px;
            }
            .popup-year-text {
                font-size: 16px;
                min-width: 60px;
            }
            .popup-year-btn {
                font-size: 18px;
            }
            .popup-year-nav {
                gap: 12px;
            }
            .year-grid-popup {
                grid-template-columns: repeat(3, 1fr);
                padding: 10px 12px 14px;
            }
            .year-cell {
                font-size: 13px;
                padding: 6px 0;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
            .card .info {
                padding: 6px 10px 10px;
            }
            .card .info .date {
                font-size: 0.7rem;
            }
            .card .info .title {
                font-size: 0.75rem;
            }
            .card .info .btn-group .download-btn {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            .modal-overlay {
                padding: 0 !important;
            }
            .modal-box {
                max-width: 100%;
                max-height: 100vh !important;
                height: 100vh !important;
                margin: 0 !important;
                border-radius: 0 !important;
                display: flex;
                flex-direction: column;
            }
            .modal-image {
                flex: 1;
                aspect-ratio: unset !important;
                width: 100%;
                height: 100%;
            }
            .modal-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                background: #000;
            }
            .modal-content {
                padding: 10px 14px 14px;
                max-height: 50%;
            }
            .modal-scroll-desc {
                max-height: 25vh;
            }
            .modal-title {
                font-size: 1rem;
            }
            .modal-desc {
                font-size: 0.8rem;
                line-height: 1.6;
            }
            .modal-image::after {
                height: 70%;
            }
            .modal-close {
                top: 8px;
                right: 8px;
                width: 32px;
                height: 32px;
                font-size: 1rem;
                z-index: 12 !important;
            }
            .date-popup {
                width: 95%;
                left: 2.5% !important;
            }
            .year-grid-popup {
                grid-template-columns: repeat(3, 1fr);
                padding: 8px 10px 12px;
            }
            .year-cell {
                font-size: 12px;
                padding: 5px 0;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="/" class="btn-home">🏠 返回首页</a>
        <div class="filters">
            <div class="filter-item">
                <span class="filter-label">选择年月：</span>
                <input class="filter-input" id="monthInput" placeholder="请选择" readonly>
                <button class="btn-filter-reset" onclick="resetAllFilters()">↺ 重置筛选</button>
            </div>
            <div class="stats">共 <span id="totalCount">0</span> 张壁纸</div>
        </div>
    </div>

    <div class="grid" id="grid">
        <div class="loading">加载壁纸数据中...</div>
    </div>

    <footer>
        <p>数据来源：Bing 每日壁纸 · 永久归档 · 仅供个人欣赏</p>
    </footer>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-image">
                <img id="modalImg" src="" alt="壁纸大图" />
            </div>
            <div class="modal-content">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-scroll-desc">
                    <div class="modal-subtitle" id="modalSubtitle"></div>
                    <div class="modal-desc" id="modalDesc"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="date-mask" id="mask">
        <div class="date-popup" id="popup"></div>
    </div>

    <script>
        // ============================================================
        // 1. URL 处理工具
        // ============================================================
        
        function isJuemeiUrl(url) {
            if (!url) return false;
            return url.includes('juemeibizhi.com');
        }

        function isBingCdnUrl(url) {
            if (!url) return false;
            return url.includes('cn.bing.com') || url.includes('bing.com');
        }

        function isCdnBimgUrl(url) {
            if (!url) return false;
            return url.includes('cdn.bimg.cc');
        }

        function getImageUrl(item) {
            var bingUrl = item.bing_url || '';
            if (isJuemeiUrl(bingUrl)) {
                return bingUrl;
            }
            return bingUrl;
        }

        function get4kUrl(item) {
            var bingUrl = item.bing_url || '';
            if (isJuemeiUrl(bingUrl)) return bingUrl;
            if (isCdnBimgUrl(bingUrl)) return bingUrl;
            if (isBingCdnUrl(bingUrl) && bingUrl.includes('_UHD')) {
                return bingUrl;
            }
            return bingUrl;
        }

        function get1080pUrl(item) {
            var bingUrl = item.bing_url || '';
            if (isJuemeiUrl(bingUrl)) return bingUrl;
            if (isCdnBimgUrl(bingUrl)) return bingUrl;
            if (isBingCdnUrl(bingUrl)) {
                if (bingUrl.includes('_UHD')) {
                    return bingUrl.replace('_UHD', '_1920x1080');
                }
                if (bingUrl.includes('_1920x1080')) {
                    return bingUrl;
                }
            }
            return bingUrl;
        }

        function get720pUrl(item) {
            var bingUrl = item.bing_url || '';
            if (isJuemeiUrl(bingUrl)) return bingUrl;
            if (isCdnBimgUrl(bingUrl)) return bingUrl;
            if (isBingCdnUrl(bingUrl)) {
                if (bingUrl.includes('_UHD')) {
                    return bingUrl.replace('_UHD', '_1280x720');
                }
                if (bingUrl.includes('_1920x1080')) {
                    return bingUrl.replace('_1920x1080', '_1280x720');
                }
            }
            return bingUrl;
        }

        function getVerticalUrl(item) {
            var bingUrl = item.bing_url || '';
            if (isJuemeiUrl(bingUrl)) return bingUrl;
            if (isCdnBimgUrl(bingUrl)) return bingUrl;
            if (isBingCdnUrl(bingUrl)) {
                if (bingUrl.includes('_UHD')) {
                    return bingUrl.replace('_UHD', '_vertical');
                }
                if (bingUrl.includes('_1920x1080')) {
                    return bingUrl.replace('_1920x1080', '_vertical');
                }
            }
            return bingUrl;
        }

        function getImageType(item) {
            var url = item.bing_url || '';
            if (isJuemeiUrl(url)) return 'normal';
            if (isCdnBimgUrl(url)) return 'normal';
            if (isBingCdnUrl(url)) {
                if (url.includes('_UHD')) return 'uhd';
                if (url.includes('_1920x1080')) return 'fhd';
            }
            return 'normal';
        }

        // ============================================================
        // 2. 图片加载管理器（支持取消旧请求）
        // ============================================================
        var imageLoader = {
            controllers: [],
            isLoading: false,
            
            // 取消所有正在加载的图片
            cancelAll: function() {
                this.controllers.forEach(function(controller) {
                    try {
                        controller.abort();
                    } catch(e) {}
                });
                this.controllers = [];
                this.isLoading = false;
            },
            
            // 加载一张图片
            loadImage: function(imgElement, url) {
                var that = this;
                return new Promise(function(resolve, reject) {
                    var controller = new AbortController();
                    that.controllers.push(controller);
                    
                    var signal = controller.signal;
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', url, true);
                    xhr.responseType = 'blob';
                    
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            var blob = xhr.response;
                            var reader = new FileReader();
                            reader.onload = function() {
                                imgElement.src = reader.result;
                                imgElement.classList.add('loaded');
                                // 隐藏占位
                                var wrapper = imgElement.closest('.img-wrapper');
                                if (wrapper) {
                                    var placeholder = wrapper.querySelector('.placeholder');
                                    if (placeholder) placeholder.style.display = 'none';
                                }
                                resolve();
                            };
                            reader.readAsDataURL(blob);
                        } else {
                            reject(new Error('HTTP ' + xhr.status));
                        }
                    };
                    xhr.onerror = function() {
                        reject(new Error('网络错误'));
                    };
                    xhr.onabort = function() {
                        reject(new Error('已取消'));
                    };
                    xhr.signal = signal;
                    xhr.send();
                    
                    // 超时处理（15秒）
                    var timeoutId = setTimeout(function() {
                        xhr.abort();
                        reject(new Error('超时'));
                    }, 15000);
                    
                    // 取消时清理超时
                    signal.addEventListener('abort', function() {
                        clearTimeout(timeoutId);
                    });
                });
            },
            
            // 串行加载图片列表（每次只加载一张）
            loadImagesSequential: function(images, onProgress) {
                var that = this;
                this.cancelAll();
                this.isLoading = true;
                
                var total = images.length;
                var loaded = 0;
                var failed = 0;
                
                return new Promise(function(resolve) {
                    function loadNext(index) {
                        if (!that.isLoading) {
                            resolve({ loaded: loaded, failed: failed });
                            return;
                        }
                        if (index >= images.length) {
                            that.isLoading = false;
                            resolve({ loaded: loaded, failed: failed });
                            return;
                        }
                        
                        var item = images[index];
                        var img = item.element;
                        var url = item.url;
                        
                        that.loadImage(img, url).then(function() {
                            loaded++;
                            if (onProgress) onProgress(loaded, total);
                            // 延迟100ms再加载下一张，避免并发过多
                            setTimeout(function() {
                                loadNext(index + 1);
                            }, 80);
                        }).catch(function(err) {
                            failed++;
                            // 显示错误占位
                            img.style.display = 'none';
                            var wrapper = img.closest('.img-wrapper');
                            if (wrapper) {
                                var placeholder = wrapper.querySelector('.placeholder');
                                if (placeholder) {
                                    placeholder.innerHTML = '❌ 加载失败';
                                    placeholder.style.display = 'flex';
                                }
                            }
                            if (onProgress) onProgress(loaded, total);
                            setTimeout(function() {
                                loadNext(index + 1);
                            }, 50);
                        });
                    }
                    
                    loadNext(0);
                });
            }
        };

        // ============================================================
        // 3. 月份控件（支持年份选择器 - 分页版）
        // ============================================================
        (function() {
            var today = new Date();
            var currentYear = today.getFullYear();
            var currentMonth = today.getMonth() + 1;

            var state = {
                year: currentYear,
                month: currentMonth,
                view: 'month',
                yearPage: 0
            };

            var mask = document.getElementById('mask');
            var popup = document.getElementById('popup');
            var monthInput = document.getElementById('monthInput');
            var monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            var allAvailableYears = [];

            function closePopup() {
                mask.classList.remove('show');
            }

            function openPopup() {
                var rect = monthInput.getBoundingClientRect();
                mask.classList.add('show');
                state.view = 'month';
                var startYear = 2010;
                var targetIdx = currentYear - startYear;
                state.yearPage = Math.floor(targetIdx / 12);
                popup.style.left = Math.max(0, rect.left) + 'px';
                popup.style.top = (rect.bottom + 6 + window.scrollY) + 'px';
                renderPopup();
            }

            function renderPopup() {
                var html = '';
                
                if (state.view === 'year') {
                    // ===== 年份选择器视图（分页） =====
                    var allYears = [];
                    var startYear = 2010;
                    var endYear = new Date().getFullYear() + 10;
                    for (var y = startYear; y <= endYear; y++) {
                        allYears.push(y);
                    }
                    
                    var totalPages = Math.ceil(allYears.length / 12);
                    var currentPage = state.yearPage;
                    if (currentPage >= totalPages) currentPage = totalPages - 1;
                    if (currentPage < 0) currentPage = 0;
                    state.yearPage = currentPage;
                    
                    var pageStart = currentPage * 12;
                    var pageEnd = Math.min(pageStart + 12, allYears.length);
                    var pageYears = allYears.slice(pageStart, pageEnd);
                    
                    html += '<div class="popup-header">';
                    html += '<button class="popup-year-page-btn" id="yearPagePrev">‹</button>';
                    html += '<span class="popup-header-title">选择年份</span>';
                    html += '<button class="popup-year-page-btn" id="yearPageNext">›</button>';
                    html += '</div>';
                    html += '<div class="year-grid-popup">';
                    
                    // 固定12个格子
                    var totalCells = 12;
                    for (var i = 0; i < totalCells; i++) {
                        if (i < pageYears.length) {
                            var y = pageYears[i];
                            var active = (y === state.year) ? 'active' : '';
                            var disabledCls = (y > currentYear) ? 'disabled' : '';
                            var hasData = (allAvailableYears.indexOf(String(y)) !== -1);
                            // 如果没有数据且年份小于等于当前年，也显示为disabled
                            var noDataCls = (!hasData && y <= currentYear) ? 'disabled' : '';
                            html += '<div class="year-cell ' + active + ' ' + disabledCls + ' ' + noDataCls + '" data-year="' + y + '">' + y + '年</div>';
                        } else {
                            html += '<div class="year-cell empty" style="opacity:0;pointer-events:none;">&nbsp;</div>';
                        }
                    }
                    html += '</div>';
                } else {
                    // ===== 月份选择器视图 =====
                    html += '<div class="popup-header">';
                    html += '<div class="popup-year-nav" style="flex:1;justify-content:center;">';
                    html += '<button class="popup-year-btn" id="popupYearPrev">‹</button>';
                    html += '<span class="popup-year-text" id="popupYearText">' + state.year + '年</span>';
                    html += '<button class="popup-year-btn" id="popupYearNext">›</button>';
                    html += '</div>';
                    html += '</div>';
                    html += '<div class="month-grid">';
                    for (var i = 0; i < monthNames.length; i++) {
                        var num = i + 1;
                        var cls = (state.month === num) ? 'active' : '';
                        html += '<div class="month-cell ' + cls + '" data-val="' + num + '">' + monthNames[i] + '</div>';
                    }
                    html += '</div>';
                }
                
                popup.innerHTML = html;

                if (state.view === 'year') {
                    // ===== 年份选择器事件 =====
                    document.getElementById('yearPagePrev').onclick = function(e) {
                        e.stopPropagation();
                        if (state.yearPage > 0) {
                            state.yearPage--;
                            renderPopup();
                        }
                    };
                    document.getElementById('yearPageNext').onclick = function(e) {
                        e.stopPropagation();
                        var totalYears = new Date().getFullYear() + 10 - 2010 + 1;
                        var totalPages = Math.ceil(totalYears / 12);
                        if (state.yearPage < totalPages - 1) {
                            state.yearPage++;
                            renderPopup();
                        }
                    };
                    
                    popup.querySelectorAll('.year-cell:not(.disabled)').forEach(function(el) {
                        el.onclick = function() {
                            var year = parseInt(this.dataset.year);
                            state.year = year;
                            state.view = 'month';
                            renderPopup();
                            updateMonthInput();
                            // 不加载数据，等待点击月份
                        };
                    });
                } else {
                    // ===== 月份选择器事件 =====
                    document.getElementById('popupYearText').onclick = function() {
                        state.view = 'year';
                        var startYear = 2010;
                        var targetIdx = state.year - startYear;
                        state.yearPage = Math.floor(targetIdx / 12);
                        renderPopup();
                    };
                    
                    document.getElementById('popupYearPrev').onclick = function(e) {
                        e.stopPropagation();
                        state.year--;
                        document.getElementById('popupYearText').textContent = state.year + '年';
                        updateMonthInput();
                        renderPopup();
                    };
                    document.getElementById('popupYearNext').onclick = function(e) {
                        e.stopPropagation();
                        if ((state.year + 1) > currentYear) return;
                        state.year++;
                        document.getElementById('popupYearText').textContent = state.year + '年';
                        updateMonthInput();
                        renderPopup();
                    };

                    popup.querySelectorAll('.month-cell').forEach(function(el) {
                        el.onclick = function() {
                            state.month = parseInt(el.dataset.val);
                            popup.querySelectorAll('.month-cell').forEach(function(c) {
                                c.classList.remove('active');
                            });
                            el.classList.add('active');
                            updateMonthInput();
                            // 只有点击月份才加载数据
                            loadData();
                            closePopup();
                        };
                    });
                }
            }

            function updateMonthInput() {
                var monthStr = String(state.month).padStart(2, '0');
                monthInput.value = state.year + ' - ' + monthStr;
            }

            monthInput.onclick = function() { openPopup(); };
            mask.onclick = function(e) { if (e.target === mask) closePopup(); };

            window.resetAllFilters = function() {
                var now = new Date();
                state.year = now.getFullYear();
                state.month = now.getMonth() + 1;
                monthInput.value = '';
                loadData();
            };

            function loadData() {
                var year = state.year;
                var month = String(state.month).padStart(2, '0');
                loadMonthData(year, month);
            }

            monthInput.placeholder = '请选择';

            window.addEventListener('DOMContentLoaded', function() {
                setTimeout(function() {
                    loadData();
                }, 100);
            });

            window.filterState = {
                getYear: function() { return state.year; },
                getMonth: function() { return state.month; }
            };
        })();

        // ============================================================
        // 4. 工具函数
        // ============================================================

        function getMonthFromDate(dateStr) {
            if (dateStr && dateStr.length >= 7) {
                return dateStr.substring(5, 7);
            }
            return '未知';
        }

        function formatTitle(item) {
            var mainTitle = item.subtitle || '';
            var subTitle = item.title || '';

            if (mainTitle && subTitle && mainTitle !== subTitle) {
                return mainTitle + ' | ' + subTitle;
            }
            if (mainTitle) {
                return mainTitle;
            }
            if (subTitle) {
                return subTitle;
            }
            return '壁纸';
        }

        var DOWNLOAD_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

        // ============================================================
        // 5. 数据加载
        // ============================================================

        var loadedData = {};
        var allAvailableYearsGlobal = [];

        async function loadIndex() {
            try {
                var resp = await fetch('index.json');
                if (!resp.ok) {
                    console.warn('⚠️ 索引文件不存在');
                    return false;
                }
                var index = await resp.json();
                if (index && index.years && index.years.length > 0) {
                    index.years.sort(function(a, b) { return parseInt(b.year) - parseInt(a.year); });
                    allAvailableYearsGlobal = index.years.map(function(item) { return item.year; });
                    // 同步到月份控件
                    if (window.filterState) {
                        window.allAvailableYearsGlobal = allAvailableYearsGlobal;
                    }
                    console.log('📅 从索引加载年份:', allAvailableYearsGlobal);
                    return true;
                }
                return false;
            } catch (e) {
                console.warn('⚠️ 加载索引失败:', e.message);
                return false;
            }
        }

        async function loadYearData(year) {
            if (loadedData[year]) {
                return loadedData[year];
            }

            try {
                var resp = await fetch('zh.' + year + '.json');
                if (!resp.ok) {
                    console.warn('⚠️ ' + year + ' 年文件不存在');
                    return [];
                }
                var data = await resp.json();
                if (Array.isArray(data) && data.length > 0) {
                    loadedData[year] = data;
                    return data;
                }
                return [];
            } catch (e) {
                console.warn('加载 ' + year + ' 年数据失败:', e.message);
                return [];
            }
        }

        // ============================================================
        // 6. 筛选与渲染（优化版 - 串行加载）
        // ============================================================

        function filterImagesByMonth(images, month) {
            if (!images || images.length === 0) return [];
            return images.filter(function(img) {
                var m = getMonthFromDate(img.date);
                return m === month;
            });
        }

        function renderGrid(images) {
            var grid = document.getElementById('grid');
            var totalCount = document.getElementById('totalCount');

            if (!images || images.length === 0) {
                grid.innerHTML = '<div class="empty">😅 没有找到匹配的壁纸</div>';
                totalCount.textContent = '0';
                return;
            }

            totalCount.textContent = images.length;

            // 先取消所有正在加载的图片
            imageLoader.cancelAll();

            var html = '';
            var loadQueue = [];

            for (var i = 0; i < images.length; i++) {
                var img = images[i];
                var dateStr = img.date || '';
                var displayTitle = formatTitle(img);
                
                var imageUrl = getImageUrl(img);
                if (isBingCdnUrl(img.bing_url)) {
                    imageUrl = get720pUrl(img);
                }
                
                var imgType = getImageType(img);
                var isUhd = (imgType === 'uhd');
                var isFhd = (imgType === 'fhd');

                var uhdUrl = get4kUrl(img);
                var fhdUrl = get1080pUrl(img);
                var normalUrl = img.bing_url || img.local_path || '';
                if (normalUrl && !normalUrl.startsWith('http') && normalUrl.startsWith('/')) {
                    normalUrl = window.location.origin + normalUrl;
                }

                var escapedData = encodeURIComponent(JSON.stringify(img));
                var imgId = 'img-' + i + '-' + Date.now();

                html += '<div class="card" data-item="' + escapedData + '">';
                html += '<div class="img-wrapper" id="wrapper-' + imgId + '">';
                html += '<div class="placeholder"><div class="spinner"></div></div>';
                html += '<img id="' + imgId + '" data-src="' + imageUrl + '" alt="' + displayTitle + '" loading="lazy" />';
                html += '</div>';
                html += '<div class="info">';
                html += '<div class="date">📅 ' + dateStr + '</div>';
                html += '<div class="title">' + displayTitle + '</div>';
                html += '<div class="btn-group">';
                
                if (isUhd) {
                    html += '<a href="' + uhdUrl + '" class="download-btn btn-4k" target="_blank" onclick="event.stopPropagation();">';
                    html += DOWNLOAD_SVG + ' 4K/UHD</a>';
                    html += '<a href="' + fhdUrl + '" class="download-btn btn-1080p" target="_blank" onclick="event.stopPropagation();">';
                    html += DOWNLOAD_SVG + ' 1080P</a>';
                } else if (isFhd) {
                    html += '<a href="' + fhdUrl + '" class="download-btn btn-1080p" target="_blank" onclick="event.stopPropagation();">';
                    html += DOWNLOAD_SVG + ' 1080P</a>';
                } else {
                    html += '<a href="' + normalUrl + '" class="download-btn btn-download" target="_blank" onclick="event.stopPropagation();">';
                    html += DOWNLOAD_SVG + ' 下载图片</a>';
                }
                
                html += '</div></div></div>';
                
                // 收集需要加载的图片
                loadQueue.push({
                    id: imgId,
                    url: imageUrl
                });
            }
            grid.innerHTML = html;

            // ===== 串行加载图片 =====
            var imgElements = [];
            loadQueue.forEach(function(item) {
                var el = document.getElementById(item.id);
                if (el) {
                    imgElements.push({
                        element: el,
                        url: item.url
                    });
                }
            });

            if (imgElements.length > 0) {
                // 显示进度
                var progressBar = document.createElement('div');
                progressBar.style.cssText = 'position:fixed;bottom:20px;right:20px;background:rgba(0,0,0,0.7);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:1000;backdrop-filter:blur(8px);';
                progressBar.id = 'loadProgress';
                progressBar.textContent = '加载图片 0/' + imgElements.length;
                document.body.appendChild(progressBar);

                imageLoader.loadImagesSequential(imgElements, function(loaded, total) {
                    var pb = document.getElementById('loadProgress');
                    if (pb) {
                        pb.textContent = '加载图片 ' + loaded + '/' + total;
                        if (loaded === total) {
                            setTimeout(function() {
                                if (pb) pb.remove();
                            }, 1000);
                        }
                    }
                }).then(function() {
                    var pb = document.getElementById('loadProgress');
                    if (pb) pb.remove();
                });
            }

            // ===== 卡片点击事件 =====
            document.querySelectorAll('.card').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('a')) return;
                    var encodedData = this.dataset.item;
                    if (encodedData) {
                        try {
                            var jsonStr = decodeURIComponent(encodedData);
                            var item = JSON.parse(jsonStr);
                            openModal(item);
                        } catch (e) {
                            console.warn('解析数据失败:', e);
                        }
                    }
                });
            });
        }

        // ============================================================
        // 7. 模态框
        // ============================================================

        function openModal(item) {
            var overlay = document.getElementById('modalOverlay');
            var displayTitle = formatTitle(item);
            document.getElementById('modalTitle').textContent = displayTitle;

            var img = document.getElementById('modalImg');
            var modalUrl = get1080pUrl(item);
            img.src = modalUrl;
            img.alt = displayTitle;

            document.getElementById('modalSubtitle').style.display = 'none';

            var desc = item.description || '';
            desc = desc.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/<br\s*\/?>/gi, '\n');
            var paragraphs = desc.split('\n').map(function(p) { return p.trim(); }).filter(function(p) { return p !== ''; });
            var descHtml = paragraphs.map(function(p) { return '<p>' + p + '</p>'; }).join('');
            document.getElementById('modalDesc').innerHTML = descHtml;

            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            var overlay = document.getElementById('modalOverlay');
            if (overlay) {
                overlay.classList.remove('open');
                document.body.style.overflow = '';
            }
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // 8. 加载数据
        // ============================================================

        async function loadMonthData(year, month) {
            var grid = document.getElementById('grid');
            grid.innerHTML = '<div class="loading">加载壁纸数据中...</div>';

            // 取消所有正在加载的图片
            imageLoader.cancelAll();

            if (allAvailableYearsGlobal.length === 0) {
                await loadIndex();
            }

            var data = loadedData[year];
            if (!data) {
                data = await loadYearData(year);
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="empty">😅 ' + year + ' 年暂无壁纸数据</div>';
                document.getElementById('totalCount').textContent = '0';
                return;
            }

            var sortedData = data.slice().sort(function(a, b) {
                var da = a.date || '';
                var db = b.date || '';
                return db.localeCompare(da);
            });

            var filtered = filterImagesByMonth(sortedData, month);

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty">😅 ' + year + '年 ' + month + '月 暂无壁纸数据</div>';
                document.getElementById('totalCount').textContent = '0';
                return;
            }

            renderGrid(filtered);
        }

        // ============================================================
        // 9. 主函数
        // ============================================================

        // 初始化加载索引
        loadIndex();

        console.log('📚 壁纸归档已加载 - 优化串行加载');
        console.log('📌 点击年份切换后，点击月份才加载图片');
        console.log('📌 图片采用串行加载，避免浏览器并发限制');
        console.log('📌 切换月份会自动取消旧图片请求');
    </script>
