<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>必应壁纸 · 首页</title>
    <meta name="description" content="每日更新的必应超清壁纸，4K 高清下载" />
    <link rel="icon" href="/favicon.avif">
    <style>
        /* ===== 基础重置 & 隐藏滚动条 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: #0e1218;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        .viewport {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .viewport::-webkit-scrollbar {
            display: none;
        }

        .fullscreen-section {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 0;
        }

        /* ===== 全新顶部导航栏（图2样式） ===== */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none; /* 让下层可点击，子元素恢复 */
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            pointer-events: auto;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .nav-left svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: auto;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .nav-center .nav-item {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .nav-center .nav-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-center .nav-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            font-weight: 500;
        }

        .nav-right {
            display: flex;
            align-items: center;
            pointer-events: auto;
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:hover {
            background: rgba(60, 60, 60, 0.6);
        }
        .theme-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* ===== 今日壁纸区域 ===== */
        #today {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            background: #0e1218;
            position: relative;
        }

        #todayCard {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e232b;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #todayCard img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 取消底部铺满的渐变，改为容器半透明遮罩 */

        /* ===== 内容容器：底部居中，半透明毛玻璃 ===== */
        #todayCard .today-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            z-index: 10;
            padding: 30px 40px;
            background: rgba(20, 24, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        /* 标题 —— 主标题居中，副标题右对齐 */
        #todayCard .today-overlay .today-title {
            display: flex;
            flex-direction: column;
            align-items: center; /* 整体居中 */
            margin-bottom: 12px;
        }

        #todayCard .today-overlay .title-main {
            font-size: 1.3rem;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-align: center;
            width: 100%;
        }

        #todayCard .today-overlay .title-sub {
            font-size: 0.95rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.85);
            width: 100%;
            text-align: right; /* 右对齐，实现与上方右侧对齐 */
            letter-spacing: 0.2px;
        }

        /* 描述文字 */
        #todayCard .today-overlay .today-desc {
            font-size: 0.9rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.8);
            max-height: 22vh;
            overflow-y: auto;
            scrollbar-width: none;
            text-align: left;
            margin-bottom: 20px;
        }
        #todayCard .today-overlay .today-desc::-webkit-scrollbar {
            width: 0px;
        }
        #todayCard .today-overlay .today-desc p {
            text-indent: 2em;
            margin-bottom: 0.3em;
        }
        #todayCard .today-overlay .today-desc p:last-child {
            margin-bottom: 0;
        }

        /* 按钮组 PC端居中 */
        #todayCard .today-overlay .today-actions-pc {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* 移动端悬浮按钮 */
        #todayCard .today-actions-mobile {
            display: none;
            position: absolute;
            top: 80px;
            right: 16px;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 10;
            max-width: calc(100vw - 32px);
        }

        /* 按钮基础样式 */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 400;
            text-decoration: none;
            color: #f0ede8;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            transition: all 0.25s;
            white-space: nowrap;
            cursor: pointer;
        }
        .btn svg {
            flex-shrink: 0;
            width: 14px;
            height: 14px;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: rgba(210, 180, 140, 0.25);
            border-color: rgba(210, 180, 140, 0.4);
            color: #fff;
        }
        .btn-primary:hover {
            background: rgba(210, 180, 140, 0.4);
        }

        /* ===== 加载状态 ===== */
        .loading {
            color: #888;
            font-size: 1rem;
            text-align: center;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .nav-center {
                display: none; /* 移动端隐藏导航条，可放更多空间，或者保留的话改下间距 */
            }
            /* 重新定义移动端导航位置和样式 */
            .top-nav {
                padding: 10px 16px;
                justify-content: space-between;
            }
            .nav-center {
                display: flex;
                position: static;
                transform: none;
                background: transparent;
                border: none;
                padding: 0;
                gap: 10px;
                box-shadow: none;
            }
            .nav-center .nav-item {
                padding: 4px 8px;
                font-size: 0.8rem;
            }
            .nav-center .nav-item.active {
                background: rgba(255, 255, 255, 0.2);
            }
            .nav-left span {
                display: none; /* 移动端隐藏文字保留图标 */
            }

            #todayCard .today-overlay {
                bottom: 20px;
                width: 95%;
                padding: 20px;
                border-radius: 16px;
            }
            #todayCard .today-overlay .title-main {
                font-size: 1.1rem;
            }
            #todayCard .today-overlay .title-sub {
                font-size: 0.8rem;
            }
            #todayCard .today-overlay .today-desc {
                font-size: 0.8rem;
                max-height: 25vh;
            }
            #todayCard .today-overlay .today-actions-pc {
                display: none;
            }
            #todayCard .today-actions-mobile {
                display: flex;
            }
            .btn {
                font-size: 0.7rem;
                padding: 5px 10px;
            }
        }

        @media (max-width: 480px) {
            #todayCard .today-overlay .title-main {
                font-size: 1rem;
            }
            #todayCard .today-overlay .title-sub {
                font-size: 0.75rem;
            }
            .nav-center .nav-item {
                font-size: 0.75rem;
                padding: 4px 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 全新顶部导航栏 ===== -->
    <nav class="top-nav">
        <div class="nav-left">
            <!-- Bing Wallpaper Logo 图标 -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 3h18v2H3V3zm0 4h18v2H3V7zm0 4h18v2H3v-2zm0 4h12v2H3v-2zm0 4h12v2H3v-2z" fill="none"/>
                <path d="M4 2h2v20H4V2zm14 0h2v20h-2V2z" fill="none"/>
            </svg>
            <span>必应壁纸</span>
        </div>
        <div class="nav-center">
            <a href="#" class="nav-item active">今日</a>
            <a href="/archive.html" class="nav-item">历史</a>
            <a href="/archive.html" class="nav-item">归档</a>
            <a href="/api.html" class="nav-item">API</a>
            <a href="/about.html" class="nav-item">关于</a>
        </div>
        <div class="nav-right">
            <button class="theme-btn" title="切换主题">
                <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </nav>

    <!-- ===== 首页壁纸 - 全屏 ===== -->
    <div class="viewport" id="viewport">
        <section id="today" class="fullscreen-section">
            <div id="todayCard">
                <div class="loading">加载中...</div>
                <div class="today-actions-mobile"></div>
            </div>
        </section>
    </div>

    <script>
        (function() {
            "use strict";

            const ICONS = {
                download: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
                book: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
                archive: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>`,
            };

            function isMobileDevice() {
                return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent) || window.innerWidth <= 640;
            }

            function get1080pUrl(url) {
                if (!url) return '';
                let result = url;
                if(isMobileDevice()){
                    result = result.replace(/_UHD\.jpg/g, '_1080x1920.jpg');
                    result = result.replace(/_1920x1080\.jpg/g, '_1080x1920.jpg');
                }else{
                    result = result.replace(/_UHD\.jpg/g, '_1920x1080.jpg');
                    result = result.replace(/_UHD\.jpg\?/g, '_1920x1080.jpg?');
                }
                result = result.replace(/&w=3840&h=2160&rs=1&c=4/g, '');
                return result;
            }

            function get4kUrl(url) {
                if (!url) return '';
                if (url.includes('_UHD.jpg')) {
                    return url;
                }
                if(isMobileDevice()){
                    return url.replace(/_1920x1080\.jpg/g, '_1080x1920.jpg');
                }else{
                    return url.replace(/_1920x1080\.jpg/g, '_UHD.jpg');
                }
            }
            
            function formatTitle(item) {
                const mainTitle = item.subtitle || '';
                const subTitle = item.title || '';
                if (mainTitle && subTitle && mainTitle !== subTitle) {
                    return { main: mainTitle, sub: subTitle };
                }
                return { main: mainTitle || subTitle || '壁纸', sub: '' };
            }

            function getDetailUrl(title, dateStr) {
                if (!dateStr) return '#';
                let cleanTitle = title.replace(/\s*[-–]\s*\d{4}\/\d{2}\/\d{2}$/, '').trim();
                const parts = dateStr.split('-');
                const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                d.setDate(d.getDate() - 1);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const dateParam = `${y}${m}${day}_1600`;
                return `https://cn.bing.com/search?q=${encodeURIComponent(cleanTitle)}&form=hpcapt&filters=HpDate:%22${dateParam}%22+mgzv3configlist:%22BingQA_Encyclopedia_Layout%22`;
            }

            function getTodayStr() {
                const now = new Date();
                const y = now.getFullYear();
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            let wallpaperDataPromise = null;
        
            function fetchWallpaperData() {
                if (!wallpaperDataPromise) {
                    wallpaperDataPromise = fetch('json/bing_wallpaper.json')
                        .then(resp => {
                            if (!resp.ok) throw new Error('HTTP ' + resp.status);
                            return resp.json();
                        })
                        .catch(err => {
                            wallpaperDataPromise = null;
                            throw err;
                        });
                }
                return wallpaperDataPromise;
            }
            
            async function loadToday() {
                const container = document.getElementById('todayCard');
                try {
                    const data = await fetchWallpaperData();

                    if (!Array.isArray(data) || data.length === 0) {
                        throw new Error('数据为空或格式无效');
                    }

                    const todayStr = getTodayStr();
                    let item = data.find(d => d.date === todayStr);

                    if (!item) {
                        console.warn(`⚠️ 没有 ${todayStr} 的数据，改用最新一条`);
                        const sorted = [...data].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                        item = sorted[0];
                    }

                    if (!item) throw new Error('无可用数据');
                    if (!item.date) item.date = todayStr;

                    const imgUrl = get1080pUrl(item.bing_url || item.url || '');
                    const titles = formatTitle(item);
                    const desc = item.description || item.desc || '暂无详细介绍';

                    // 拆分段落
                    let descHtml = '';
                    if (desc) {
                        const paragraphs = desc.split('\n')
                            .map(p => p.trim())
                            .filter(p => p !== '');
                        descHtml = paragraphs.map(p => `<p>${p}</p>`).join('');
                    }

                    // 格式化日期（把 2026-10-18 改成 2026/10/18）
                    const displayDate = item.date ? item.date.replace(/-/g, '/') : '';

                    const detailUrl = getDetailUrl(item.title || item.subtitle || '', item.date);
                    
                    // 重新组织标题结构
                    const titleHtml = `
                        <div class="title-main">${titles.main}</div>
                        ${titles.sub ? `<div class="title-sub">- ${titles.sub} （${displayDate}）</div>` : (displayDate ? `<div class="title-sub">- （${displayDate}）</div>` : '')}
                    `;
                    
                    const htmlPcActions = `
                        <div class="today-actions-pc">
                            <a href="${get4kUrl(item.bing_url || item.url || '')}" class="btn btn-primary" target="_blank">${ICONS.download} UHD/4K</a>
                            <a href="${get1080pUrl(item.bing_url || item.url || '')}" class="btn btn-secondary" target="_blank">${ICONS.download} 1080P</a>
                            <a href="${detailUrl}" class="btn btn-secondary" target="_blank">${ICONS.book} 光影回顾</a>
                            <a href="/archive.html" class="btn btn-secondary">${ICONS.archive} 壁纸归档</a>
                        </div>
                    `;
                    
                    const mobileBtnHtml = `
                        <a href="${get4kUrl(item.bing_url || item.url || '')}" class="btn btn-primary" target="_blank">${ICONS.download} UHD/4K</a>
                        <a href="${get1080pUrl(item.bing_url || item.url || '')}" class="btn btn-secondary" target="_blank">${ICONS.download} 1080P</a>
                        <a href="${detailUrl}" class="btn btn-secondary" target="_blank">${ICONS.book} 光影回顾</a>
                        <a href="/archive.html" class="btn btn-secondary">${ICONS.archive} 壁纸归档</a>
                    `;

                    container.innerHTML = `
                        <img src="${imgUrl}" alt="${titles.main}" loading="lazy" onerror="this.style.display='none'" />
                        <div class="today-overlay">
                            <div class="today-title">
                                ${titleHtml}
                            </div>
                            <div class="today-desc">${descHtml || '暂无详细介绍'}</div>
                            ${htmlPcActions}
                        </div>
                        <div class="today-actions-mobile">${mobileBtnHtml}</div>
                    `;
                    console.log('✅ 首页壁纸加载成功:', item.date);
                } catch (e) {
                    console.warn('首页壁纸加载失败:', e);
                    container.innerHTML = `<div class="loading">⚠️ 加载失败: ${e.message}</div>`;
                }
            }

            // 启动
            loadToday();
        })();
    </script>
</body>
</html>
