name: Daily Update

on:
  schedule:
    # UTC时间+8小时
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Fetch and process today's wallpaper
        id: fetch
        run: |
          python3 << 'EOF'
          import json
          import re
          import requests
          from datetime import datetime, timedelta, timezone
          import os

          # ============================================================
          # 0. 调试信息 - 确认工作目录和文件
          # ============================================================
          print("=" * 60)
          print("🔍 环境调试信息")
          print("=" * 60)
          print(f"📂 当前工作目录: {os.getcwd()}")

          # 列出当前目录所有文件
          files = os.listdir('.')
          print(f"📄 目录下共有 {len(files)} 个文件/文件夹")
          for f in files:
              print(f"  - {f}")

          # 检查 docs 目录
          if os.path.exists('docs'):
              docs_files = os.listdir('docs')
              print(f"📄 docs 目录下共有 {len(docs_files)} 个文件/文件夹")
              for f in docs_files:
                  print(f"  - docs/{f}")

          # ============================================================
          # 1. 优先检查 today.json 是否存在且是当天数据
          # ============================================================
          print("\n" + "=" * 60)
          print("📋 步骤1: 检查 today.json 缓存")
          print("=" * 60)

          today_file = 'docs/today.json'
          use_cache = False
          cached_data = None
          date_str = None
          title = ''
          subtitle = ''
          description = ''
          bing_url = ''

          beijing_tz = timezone(timedelta(hours=8))
          now_beijing = datetime.now(beijing_tz)
          today_str = f"{now_beijing.year}-{str(now_beijing.month).zfill(2)}-{str(now_beijing.day).zfill(2)}"
          print(f"📅 今日日期 (北京时间): {today_str}")

          # 检查文件是否存在
          if os.path.exists(today_file):
              print(f"✅ today.json 文件存在 (docs/today.json)")
              try:
                  with open(today_file, 'r', encoding='utf-8') as f:
                      cached_data = json.load(f)
                  print(f"📄 today.json 内容类型: {type(cached_data)}")

                  # 打印缓存内容（截断）
                  cache_preview = json.dumps(cached_data, ensure_ascii=False)
                  if len(cache_preview) > 500:
                      cache_preview = cache_preview[:500] + "..."
                  print(f"📄 today.json 内容预览: {cache_preview}")

                  cache_date = cached_data.get('date')
                  print(f"📅 缓存中的日期: {cache_date}")

                  if cache_date == today_str:
                      use_cache = True
                      print(f"✅ 缓存命中！today.json 已是当天数据 ({today_str})，直接使用缓存")
                  else:
                      print(f"⚠️ 缓存日期 ({cache_date}) 不等于今日 ({today_str})，需要更新")

              except json.JSONDecodeError as e:
                  print(f"❌ today.json 格式错误: {e}")
              except Exception as e:
                  print(f"❌ 读取 today.json 失败: {e}")
          else:
              print(f"❌ today.json 文件不存在 (docs/today.json)，需要从 API 获取")

          # ============================================================
          # 2. 如果缓存有效，直接使用；否则从 API + 第三方提取
          # ============================================================
          print("\n" + "=" * 60)
          print("📋 步骤2: 获取数据")
          print("=" * 60)

          if use_cache and cached_data:
              # 直接使用缓存数据
              title = cached_data.get('title', '')
              subtitle = cached_data.get('subtitle', '')
              description = cached_data.get('description', '')
              bing_url = cached_data.get('bing_url', '')
              date_str = cached_data.get('date', today_str)
              print(f"📦 使用缓存数据 (docs/today.json)")
              print(f"  - title: {title}")
              print(f"  - subtitle: {subtitle}")
              print(f"  - date: {date_str}")
              print(f"  - description 长度: {len(description)} 字符")

          else:
              # ============================================================
              # 2a. 从 Bing API 获取数据
              # ============================================================
              print("📡 从 Bing API 获取今日数据...")
              api_url = "https://cn.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&setmkt=zh-CN"
              resp = requests.get(api_url, timeout=10)

              print(f"  - 状态码: {resp.status_code}")
              if resp.status_code != 200:
                  print(f"❌ API 请求失败: {resp.status_code}")
                  exit(1)

              api_data = resp.json()
              if not api_data.get('images'):
                  print("❌ API 返回数据为空")
                  exit(1)

              img = api_data['images'][0]
              enddate = img.get('enddate', '')
              copyright_text = img.get('copyright', '')
              urlbase = img.get('urlbase', '')

              print(f"  - enddate: {enddate}")
              print(f"  - copyright: {copyright_text}")
              print(f"  - urlbase: {urlbase}")

              if len(enddate) == 8:
                  date_str = f"{enddate[:4]}-{enddate[4:6]}-{enddate[6:8]}"
              else:
                  date_str = enddate

              print(f"📅 API 返回日期: {date_str}")

              # ============================================================
              # 2b. 从 bing.ee123.net 提取
              # ============================================================
              print("\n🔗 尝试从 bing.ee123.net 提取...")
              try:
                  detail_url = f"https://bing.ee123.net/detail/{enddate}"
                  print(f"  - URL: {detail_url}")
                  response = requests.get(detail_url, timeout=15, headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                  })
                  print(f"  - 状态码: {response.status_code}")

                  if response.status_code == 200:
                      html = response.text
                      print(f"  - HTML 长度: {len(html)} 字符")

                      title_match = re.search(r'<p[^>]*class="title"[^>]*>(.*?)</p>', html, re.DOTALL)
                      if title_match:
                          raw_title = title_match.group(1)
                          raw_title = raw_title.replace('&nbsp;', ' ')
                          raw_title = re.sub(r'\s+', ' ', raw_title).strip()
                          display_title = re.sub(r'\s*\(©[^)]*\)\s*', '', raw_title)

                          parts = display_title.split(' | ')
                          if len(parts) >= 2:
                              subtitle = parts[0].strip()
                              second_part = parts[1].strip()
                              second_part = re.sub(r'\s*-\s*', ' - ', second_part)
                              title = second_part
                          else:
                              title = re.sub(r'\s*\(©[^)]*\)\s*', '', copyright_text)
                              title = re.sub(r'\s*,\s*$', '', title)
                              subtitle = title
                          print(f"✅ 从 ee123 提取到标题: '{title}'")
                          print(f"  - subtitle: {subtitle}")

                      sub_match = re.search(r'<span[^>]*class="sub"[^>]*>([\s\S]*?)</span>', html)
                      if sub_match:
                          sub_content = sub_match.group(1)
                          p_tags = re.findall(r'<p>(.*?)</p>', sub_content, re.DOTALL)
                          desc_parts = [p.strip() for p in p_tags if p.strip()]
                          if desc_parts:
                              clean_parts = []
                              for p in desc_parts:
                                  p = p.replace('&nbsp;', ' ')
                                  p = p.replace('&lt;', '<').replace('&gt;', '>').replace('&amp;', '&')
                                  p = p.replace('&quot;', '"').replace('&#39;', "'")
                                  if p.strip():
                                      clean_parts.append(p.strip())
                              if clean_parts:
                                  description = '\n'.join(clean_parts)
                                  print(f"✅ 从 ee123 提取成功，共 {len(clean_parts)} 段描述")
                                  print(f"  - 第一段预览: {clean_parts[0][:100]}...")

              except Exception as e:
                  print(f"⚠️ bing.ee123.net 提取失败: {e}")

              # ============================================================
              # 2c. 兜底：dailybing.cn（使用 BeautifulSoup 提取）
              # ============================================================
              if not description or not title:
                  print("\n🔗 尝试从 dailybing.cn 提取...")
                  try:
                      from bs4 import BeautifulSoup
                      
                      detail_url = f"https://www.dailybing.cn/view/zh-cn/{enddate}.html"
                      print(f"  - URL: {detail_url}")
                      response = requests.get(detail_url, timeout=15, headers={
                          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                      })
                      print(f"  - 状态码: {response.status_code}")
              
                      if response.status_code == 200:
                          html = response.text
                          print(f"  - HTML 长度: {len(html)} 字符")
              
                          soup = BeautifulSoup(html, "html.parser")
              
                          # ----- 1. 提取主标题（img alt）-----
                          main_title = ""
                          img_ele = soup.select_one('img.view.landscape') or soup.select_one('img.view.portrait')
                          if img_ele and img_ele.has_attr("alt"):
                              main_title = img_ele["alt"].strip()
                              print(f"  ✅ 提取主标题: '{main_title}'")
              
                          # ----- 2. 提取 copyright 作为副标题 -----
                          sub_title = ""
                          copyright_ele = soup.select_one(".story-copyright")
                          if copyright_ele:
                              copyright_raw = copyright_ele.get_text(strip=False)
                              # 清洗HTML实体
                              copyright_raw = copyright_raw.replace('&nbsp;', ' ')
                              copyright_raw = copyright_raw.replace('&lt;', '<').replace('&gt;', '>').replace('&amp;', '&')
                              copyright_raw = copyright_raw.replace('&quot;', '"').replace('&#39;', "'")
                              copyright_raw = re.sub(r'\s+', ' ', copyright_raw).strip()
                              # 移除版权标记
                              sub_title = re.sub(r'\s*\(©[^)]*\)\s*', '', copyright_raw).strip()
                              print(f"  ✅ 提取副标题: '{sub_title[:60]}...'")
              
                          # ----- 3. 组装标题 -----
                          clean_title = sub_title or main_title
                          date_slash = date_str.replace("-", "/")
                          if clean_title:
                              title = f"{clean_title.strip()} - {date_slash}"
                          else:
                              title = main_title or date_slash
                          print(f"  ✅ 构建完整标题: '{title}'")
              
                          # ----- 4. 提取描述（跳过第一段） -----
                          description = ""
                          story_content_ele = soup.select_one(".story-content")
                          if story_content_ele:
                              p_list = story_content_ele.select(".story-paragraph")
                              print(f"  📖 找到 {len(p_list)} 个段落")
                              clean_parts = []
                              is_first = True
                              for p in p_list:
                                  raw_text = p.get_text()
                                  text = re.sub(r'\s+', ' ', raw_text).strip()
                                  text = text.replace('&nbsp;', ' ')
                                  text = text.replace('&lt;', '<').replace('&gt;', '>').replace('&amp;', '&')
                                  if len(text) > 10:
                                      if is_first:
                                          is_first = False
                                          continue
                                      clean_parts.append(text)
                              if clean_parts:
                                  description = '\n'.join(clean_parts)
                                  print(f"  ✅ 提取描述：共 {len(clean_parts)} 段，{len(description)} 字符")
                              else:
                                  print(f"  ⚠️ 未提取到有效描述段落")
              
                          # ----- 5. 设置 subtitle -----
                          if main_title:
                              subtitle = main_title
                          elif sub_title:
                              subtitle = sub_title
                          else:
                              subtitle = clean_title

                  except Exception as e:
                      print(f"  ❌ dailybing.cn 提取失败: {e}")


              bing_url = f"https://cn.bing.com{urlbase}_UHD.jpg" if urlbase else ''
              print(f"  - bing_url: {bing_url}")

              # ============================================================
              # 2e. 保存到 docs/today.json
              # ============================================================
              print("\n💾 保存到 docs/today.json")
              result = {
                  "title": title,
                  "subtitle": subtitle,
                  "description": description,
                  "date": date_str,
                  "bing_url": bing_url
              }

              # 确保 docs 目录存在
              os.makedirs('docs', exist_ok=True)

              with open('docs/today.json', 'w', encoding='utf-8') as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
              print("✅ 已更新 docs/today.json")

          # ============================================================
          # 3. 对比 today.json 和 zh.{year}.json 最新一条数据
          # ============================================================
          print("\n" + "=" * 60)
          print("📋 步骤3: 对比数据是否变化")
          print("=" * 60)

          year = date_str[:4]
          year_file = f"docs/zh.{year}.json"
          print(f"📄 对比文件: {year_file}")

          need_write = True
          existing = []

          # 读取 zh.{year}.json
          if os.path.exists(year_file):
              try:
                  with open(year_file, 'r', encoding='utf-8') as f:
                      existing = json.load(f)
                  print(f"📊 读取到 {len(existing)} 条现有数据")

                  # 获取最新一条数据
                  if existing:
                      latest = existing[0]
                      print(f"📄 最新一条数据:")
                      print(f"  - title: {latest.get('title')}")
                      print(f"  - date: {latest.get('date')}")

                      # 对比 today.json 和最新一条数据
                      if (latest.get('title') == title and
                          latest.get('subtitle') == subtitle and
                          latest.get('description') == description and
                          latest.get('bing_url') == bing_url):
                          need_write = False
                          print(f"✅ 数据未变化，跳过写入 {year_file}")
                      else:
                          print(f"⚠️ 数据有变化，需要更新")
                          print(f"  - title 变化: {latest.get('title')} != {title}")
                  else:
                      print(f"📄 文件为空，需要写入")
              except Exception as e:
                  print(f"⚠️ 读取失败: {e}")
                  existing = []
          else:
              print(f"📄 文件不存在，需要创建")

          # ============================================================
          # 4. 如果需要，写入 zh.{year}.json
          # ============================================================
          if need_write:
              print("\n" + "=" * 60)
              print("📋 步骤4: 写入年份文件")
              print("=" * 60)

              # 去重
              before_count = len(existing)
              existing = [item for item in existing if item.get('date') != date_str]
              removed_count = before_count - len(existing)
              if removed_count > 0:
                  print(f"🗑️ 删除了 {removed_count} 条日期为 {date_str} 的旧数据")

              new_data = {
                  "title": title,
                  "subtitle": subtitle,
                  "description": description,
                  "date": date_str,
                  "bing_url": bing_url
              }
              existing.append(new_data)
              existing.sort(key=lambda x: x.get('date', ''), reverse=True)

              os.makedirs('docs', exist_ok=True)

              with open(year_file, 'w', encoding='utf-8') as f:
                  json.dump(existing, f, ensure_ascii=False, indent=2)
              print(f"✅ 已更新 {year_file}，共 {len(existing)} 张壁纸")
          else:
              print(f"⏭️ 跳过写入 {year_file}（数据未变化）")

          # ============================================================
          # 5. 输出汇总
          # ============================================================
          print("\n" + "=" * 60)
          print("📊 执行完成 - 汇总信息")
          print("=" * 60)
          print(f"📝 title: '{title}'")
          print(f"📝 subtitle: '{subtitle}'")
          print(f"📝 描述长度: {len(description)} 字符")
          print(f"📅 日期: {date_str}")
          print(f"📦 数据来源: {'缓存 (docs/today.json)' if use_cache else 'API + 第三方提取'}")
          print(f"📄 年份文件: {'已更新' if need_write else '未变化，跳过'}")

          # 验证文件
          print("\n🔍 验证文件:")
          for f in ['docs/today.json', year_file]:
              if os.path.exists(f):
                  size = os.path.getsize(f)
                  print(f"  ✅ {f} 存在 ({size} 字节)")
              else:
                  print(f"  ❌ {f} 不存在")

          # 写入环境变量供后续步骤使用
          title_clean = title.replace('\n', ' ').replace('\r', ' ').strip()
          subtitle_clean = subtitle.replace('\n', ' ').replace('\r', ' ').strip()
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"TITLE={title_clean}\n")
              f.write(f"SUBTITLE={subtitle_clean}\n")
              f.write(f"DATE={date_str}\n")
              f.write(f"BING_URL={bing_url}\n")
              f.write(f"NEED_WRITE={need_write}\n")
              f.write(f"DATA_SOURCE={'本地缓存' if use_cache else '第三方提取'}\n")
          EOF

      - name: Push today.json and sync
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEED_WRITE: ${{ env.NEED_WRITE }}
        run: |
          # 判断是否需要同步
          if [ "$NEED_WRITE" != "True" ]; then
            echo "⏭️ 数据无变化，跳过推送和同步"
            exit 0
          fi
          
          echo "📤 推送 today.json 到远程..."
          git config --local user.email "liuxiaolei5214@gmail.com"
          git config --local user.name "liuxiaolei5214"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/liuxiaolei5214/bing-wallpaper.git
          
          git add docs/today.json
          if git diff --cached --quiet; then
            echo "  today.json 无变化"
          else
            git commit -m "Update today.json for sync"
            git push origin main
            echo "✅ today.json 已推送"
          fi
          
          echo ""
          echo "📡 调用同步API..."
          sleep 2
          curl -s -X GET "https://bing.ll1524.cc.cd/api/sync-github?key=ll1524ql2026" || echo "⚠️ API调用失败，继续执行"

      - name: Send WeChat notification
        env:
          TITLE: ${{ env.TITLE }}
          SUBTITLE: ${{ env.SUBTITLE }}
          DATE: ${{ env.DATE }}
          BING_URL: ${{ env.BING_URL }}
          NEED_WRITE: ${{ env.NEED_WRITE }}
          DATA_SOURCE: ${{ env.DATA_SOURCE }}
        run: |
          echo "📱 发送企业微信通知..."
          python3 << 'EOF'
          import requests
          import json
          import os
          import random
          import re
      
          # ============================================================
          # 配置
          # ============================================================
          WECHAT_WEBHOOK = 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=fbc3ee80-bc01-439f-965b-6e8806e39351'
          LINK_URL = 'https://ql.ll1524.cc.cd/task10?key=ll1524ql2026'
      
          IMAGES = [
              'https://image.lei5214.cc.cd/img/2026/03/1.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/2.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/3.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/4.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/5.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/6.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/7.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/8.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/9.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/10.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/11.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/12.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/13.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/14.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/15.jpg',
              'https://image.lei5214.cc.cd/img/2026/03/16.jpg'
          ]
      
          def get_random_image():
              return random.choice(IMAGES) if IMAGES else ''
      
          def clean_title(title):
              return re.sub(r' - \d{4}/\d{2}/\d{2}$', '', title)
      
          # ============================================================
          # 获取环境变量
          # ============================================================
          title = os.environ.get('TITLE', '今日壁纸')
          subtitle = os.environ.get('SUBTITLE', '')
          date_str = os.environ.get('DATE', '')
          need_write = os.environ.get('NEED_WRITE', 'True') == 'True'
          data_source = os.environ.get('DATA_SOURCE', '缓存')
      
          title_clean = clean_title(title)
      
          # ============================================================
          # 构建消息
          # ============================================================
          if need_write:
              title_msg = '🎉 Bing壁纸 · 提取推送'
              description_msg = f'数据来源：{data_source}\n'
              description_msg += f'提取日期：{date_str}\n'
              description_msg += f'壁纸主标：{subtitle}\n'
              description_msg += f'壁纸副标：{title_clean}'
          else:
              title_msg = '⏭️ Bing壁纸 · 今日已更新'
              description_msg = f'数据来源：{data_source}\n'
              description_msg += f'当前状态：数据已存在\n'
              description_msg += f'当前日期：{date_str}'
      
          # ============================================================
          # 发送消息（强制 UTF-8 编码）
          # ============================================================
          message = {
              'msgtype': 'news',
              'news': {
                  'articles': [{
                      'title': title_msg,
                      'description': description_msg,
                      'url': LINK_URL,
                      'picurl': get_random_image()
                  }]
              }
          }
      
          try:
              # 使用 ensure_ascii=False 保留 emoji
              payload = json.dumps(message, ensure_ascii=False).encode('utf-8')
              
              response = requests.post(
                  WECHAT_WEBHOOK,
                  data=payload,
                  timeout=10,
                  headers={'Content-Type': 'application/json; charset=utf-8'}
              )
              result = response.json()
              if result.get('errcode') == 0:
                  print('✅ 企业微信通知发送成功')
              else:
                  print(f'❌ 企业微信通知发送失败: {result.get("errmsg")}')
          except Exception as e:
              print(f'⚠️ 企业微信通知发送异常: {e}')
          EOF

      - name: Generate combined history.json
        run: |
          echo '[]' > docs/history.json
          for year in $(seq 2020 $(date +'%Y')); do
            if [ -f "docs/zh.${year}.json" ]; then
              jq -s '.[0] + .[1]' docs/history.json "docs/zh.${year}.json" > docs/history_temp.json
              mv docs/history_temp.json docs/history.json
            fi
          done
          jq 'unique_by(.date) | sort_by(.date) | reverse' docs/history.json > docs/history_temp.json
          mv docs/history_temp.json docs/history.json
          echo "✅ 合并所有年份，共 $(jq 'length' docs/history.json) 张壁纸"

      - name: Generate index file
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime

          current_year = datetime.now().year
          index = {"years": []}

          for year in range(2020, current_year + 1):
              filename = f"docs/zh.{year}.json"
              if os.path.exists(filename):
                  try:
                      with open(filename, 'r', encoding='utf-8') as f:
                          data = json.load(f)
                          count = len(data) if isinstance(data, list) else 0
                          if count > 0:
                              index["years"].append({"year": str(year), "count": count})
                              print(f"✅ 发现 {year} 年数据，共 {count} 条")
                  except Exception as e:
                      print(f"⚠️ 读取 {year} 年数据失败: {e}")

          index["years"].sort(key=lambda x: int(x["year"]), reverse=True)

          with open('docs/index.json', 'w', encoding='utf-8') as f:
              json.dump(index, f, ensure_ascii=False, indent=2)

          print(f"✅ 生成索引文件，共 {len(index['years'])} 个年份")
          EOF

      - name: Touch index.html to refresh cache
        run: |
          touch docs/index.html
          export TZ='Asia/Shanghai'
          echo "✅ 缓存已刷新 (北京时间)  $(date '+%Y-%m-%d %H:%M:%S')" >> docs/cache.log

      - name: Commit and push changes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "liuxiaolei5214@gmail.com"
          git config --local user.name "liuxiaolei5214"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/liuxiaolei5214/bing-wallpaper.git
          git pull origin main --rebase --autostash || true
          git add docs/zh.*.json docs/history.json docs/index.json docs/index.html docs/cache.log docs/today.json
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push."
          else
            git commit -m "Daily update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi
