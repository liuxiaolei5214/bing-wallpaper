name: 更新 JSON 增加 local_path 字段

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      year:
        description: '指定年份（留空则处理所有年份）'
        required: false
        default: ''
        type: string

jobs:
  update-json:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        
      - name: 更新 JSON 文件（保留原标题，增加 local_path）
        run: |
          python3 << 'EOF'
          import os
          import json
          from datetime import datetime
          
          images_dir = "images"
          
          # 获取要处理的年份
          years = []
          specified_year = "${{ github.event.inputs.year }}"
          
          if specified_year:
              if os.path.isdir(os.path.join(images_dir, specified_year)):
                  years = [specified_year]
              else:
                  print(f"⚠️ 年份 {specified_year} 不存在")
                  exit(1)
          else:
              # 获取所有年份目录
              for item in os.listdir(images_dir):
                  item_path = os.path.join(images_dir, item)
                  if os.path.isdir(item_path) and item.isdigit():
                      years.append(item)
              years.sort()
          
          if not years:
              print("❌ 没有找到任何年份目录")
              exit(1)
          
          print(f"📁 处理年份: {', '.join(years)}")
          
          for year in years:
              year_path = os.path.join(images_dir, year)
              json_file = os.path.join(images_dir, f"zh.{year}.json")
              
              # 1. 读取现有的 JSON（如果存在）
              existing_data = {}
              if os.path.exists(json_file):
                  with open(json_file, 'r', encoding='utf-8') as f:
                      try:
                          existing_list = json.load(f)
                          # 将列表转换为字典，以日期为键
                          for item in existing_list:
                              date_key = item.get('date', '')
                              if date_key:
                                  existing_data[date_key] = item
                          print(f"📖 读取现有文件 {json_file}，共 {len(existing_data)} 条记录")
                      except json.JSONDecodeError:
                          print(f"⚠️ JSON 解析失败，将重新生成 {json_file}")
                          existing_data = {}
              else:
                  print(f"📝 创建新文件 {json_file}")
              
              # 2. 扫描该年份的图片文件
              image_files = []
              for img_file in sorted(os.listdir(year_path)):
                  if img_file.endswith('.jpg') or img_file.endswith('.png'):
                      date_str = img_file.replace('.jpg', '').replace('.png', '')
                      try:
                          if len(date_str) == 8:
                              date_obj = datetime.strptime(date_str, "%Y%m%d")
                              formatted_date = date_obj.strftime("%Y-%m-%d")
                          else:
                              formatted_date = date_str
                      except:
                          formatted_date = date_str
                      
                      image_files.append({
                          'filename': img_file,
                          'date_str': date_str,
                          'formatted_date': formatted_date
                      })
              
              print(f"🖼️ 找到 {len(image_files)} 张图片")
              
              # 3. 更新或创建条目
              updated_list = []
              for img_info in image_files:
                  date_key = img_info['formatted_date']
                  local_path = f"images/{year}/{img_info['filename']}"
                  
                  # 如果该日期已存在，保留原标题和描述，更新 local_path
                  if date_key in existing_data:
                      item = existing_data[date_key].copy()
                      item['local_path'] = local_path
                      print(f"   ✓ 更新: {date_key} - 保留原标题")
                  else:
                      # 创建新条目
                      # 尝试从日期生成标题
                      try:
                          date_obj = datetime.strptime(img_info['date_str'], "%Y%m%d")
                          title_date = date_obj.strftime("%Y/%m/%d")
                      except:
                          title_date = date_key
                      
                      item = {
                          "title": f"必应壁纸 - {title_date}",
                          "description": "",
                          "date": date_key,
                          "bing_url": f"https://www.juemeibizhi.com/images/original/{img_info['date_str']}.jpg",
                          "local_path": local_path
                      }
                      print(f"   + 新增: {date_key}")
                  
                  updated_list.append(item)
              
              # 4. 检查是否有缺失的图片（JSON 中有但文件不存在）
              missing_count = 0
              for date_key, item in existing_data.items():
                  if not any(img['formatted_date'] == date_key for img in image_files):
                      # 图片文件已删除，从 JSON 中移除
                      print(f"   ✗ 移除: {date_key} (图片不存在)")
                      missing_count += 1
              
              # 5. 按日期排序并写入
              updated_list.sort(key=lambda x: x.get('date', ''))
              
              with open(json_file, 'w', encoding='utf-8') as f:
                  json.dump(updated_list, f, ensure_ascii=False, indent=2)
              
              print(f"✅ 更新完成 {json_file}，共 {len(updated_list)} 条记录")
              if missing_count > 0:
                  print(f"   (移除了 {missing_count} 条不存在的图片记录)")
          
          # 6. 生成汇总文件
          all_images = []
          for year in years:
              json_file = os.path.join(images_dir, f"zh.{year}.json")
              if os.path.exists(json_file):
                  with open(json_file, 'r', encoding='utf-8') as f:
                      year_data = json.load(f)
                      all_images.extend(year_data)
          
          if all_images:
              all_images.sort(key=lambda x: x.get('date', ''))
              with open('images.json', 'w', encoding='utf-8') as f:
                  json.dump(all_images, f, ensure_ascii=False, indent=2)
              print(f"✅ 生成汇总 images.json，共 {len(all_images)} 张图片")
          
          EOF
          
      - name: 复制 JSON 文件到 docs 目录
        run: |
          mkdir -p docs
          
          # 复制所有 zh.*.json
          for json_file in images/zh.*.json; do
            if [ -f "$json_file" ]; then
              filename=$(basename "$json_file")
              cp "$json_file" "docs/$filename"
              echo "✅ 复制 $filename 到 docs/"
            fi
          done
          
          # 复制汇总文件
          if [ -f "images.json" ]; then
            cp images.json docs/images.json
            echo "✅ 复制 images.json 到 docs/"
          fi
          
          echo "📁 docs 目录内容:"
          ls -la docs/
          
      - name: 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add images/zh.*.json images.json docs/zh.*.json docs/images.json
          
          if git diff --staged --quiet; then
            echo "没有变化需要提交"
          else
            git commit -m "更新 JSON: 增加 local_path 字段 $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 提交成功"
          fi
