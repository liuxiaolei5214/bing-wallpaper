name: 手动下载壁纸图片(用完删除)
on:
  workflow_dispatch: # 仅网页手动点按钮运行，无任何自动触发

jobs:
  download:
    runs-on: ubuntu‑latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch‑depth: 0

      - name: 配置 Node 22
        uses: actions/setup‑node@v4
        with:
          node‑version: 22

      - name: 安装依赖
        run: npm install axios fs‑extra

      - name: 云端执行下载脚本
        run: node download.js

      - name: 提交下载的图片回仓库
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add ./images/*
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 手动任务：下载bing壁纸图片" && git push)
